<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Stream Overlay Suite (3 Horizontal & 3 Vertical)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Metamorphous&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --genshin-gold: #e8c688;
      --genshin-gold-bright: #fff2bf;
      --genshin-dark: #090e1a;
      --panel-bg: rgba(12, 18, 34, 0.96);
      --panel-border: rgba(232, 198, 136, 0.4);
      --accent-color: #71efff;
      --accent-glow: rgba(113, 239, 255, 0.55);
      --accent-gradient: linear-gradient(135deg, #71efff 0%, #1e528e 100%);
    }

    .theme-cryo { --accent-color: #8be4ff; --accent-glow: rgba(139, 228, 255, 0.55); --accent-gradient: linear-gradient(135deg, #a6f0ff 0%, #3080b0 100%); }
    .theme-anemo { --accent-color: #5cf2bd; --accent-glow: rgba(92, 242, 189, 0.55); --accent-gradient: linear-gradient(135deg, #72ffd0 0%, #1d8263 100%); }
    .theme-electro { --accent-color: #d28bff; --accent-glow: rgba(210, 139, 255, 0.55); --accent-gradient: linear-gradient(135deg, #e4aeff 0%, #6f2fa0 100%); }
    .theme-pyro { --accent-color: #ff9d6b; --accent-glow: rgba(255, 157, 107, 0.55); --accent-gradient: linear-gradient(135deg, #ffb38a 0%, #b83c1b 100%); }
    .theme-hydro { --accent-color: #43b3ff; --accent-glow: rgba(67, 179, 255, 0.55); --accent-gradient: linear-gradient(135deg, #69c5ff 0%, #1656a8 100%); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Quicksand', sans-serif; background-color: var(--genshin-dark); color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-genshin { font-family: 'Metamorphous', 'Cinzel', serif; }

    .starfield-bg {
      background-color: #080c18;
      background-image: 
        radial-gradient(1.5px 1.5px at 25px 35px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 80px, var(--accent-color), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 100px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 170px 130px, var(--genshin-gold), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 240px 90px, #ffffff, rgba(0,0,0,0));
      background-size: 280px 280px;
    }

    .genshin-panel {
      position: relative;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
    }

    .glow-gold { text-shadow: 0 0 10px rgba(232, 198, 136, 0.5); }
    .glow-accent { color: var(--accent-color); text-shadow: 0 0 12px var(--accent-glow); }

    .primogem-shape {
      width: 18px; height: 18px;
      background: var(--accent-gradient);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      display: inline-block;
    }

    .obs-viewport-horizontal { width: 1920px; height: 1080px; position: fixed; top: 0; left: 0; overflow: hidden; z-index: 99999; }
    .obs-viewport-vertical { width: 1080px; height: 1920px; position: fixed; top: 0; left: 0; overflow: hidden; z-index: 99999; }
  </style>
</head>
<body id="appBody" class="min-h-screen theme-cryo bg-slate-950 text-slate-100 flex flex-col">

  <!-- DASHBOARD WORKSPACE -->
  <div id="dashboardUI" class="flex flex-col min-h-screen w-full">
    <header class="bg-slate-950/95 border-b border-amber-500/30 px-6 py-3 sticky top-0 z-50 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="primogem-shape"></span>
        <h1 class="font-cinzel font-bold text-amber-200 text-lg">STREAM OVERLAY STUDIO</h1>
      </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-4 md:p-6 max-w-[1800px] w-full mx-auto">
      <div class="lg:col-span-4 bg-slate-900/90 border border-amber-500/30 rounded-xl p-5 shadow-2xl flex flex-col space-y-4">
        <h2 class="font-cinzel font-bold text-amber-300 text-sm uppercase">Master Control Panel</h2>
        
        <div class="space-y-3.5 text-xs">
          <div>
            <label class="text-amber-200/90 font-bold block mb-1">Channel Handle</label>
            <input type="text" id="cfgChannel" value="@ThirdDescender" oninput="pushChanges()" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-3 py-2 text-amber-100">
          </div>
          <div>
            <label class="text-amber-200/90 font-bold block mb-1">Stream Title</label>
            <input type="text" id="cfgTitle" value="Version 7.1 F2P Speedrun | 0 Chests Challenge" oninput="pushChanges()" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-3 py-2 text-amber-100">
          </div>
          <div>
            <label class="text-amber-200/90 font-bold block mb-1">Announcement Banner</label>
            <input type="text" id="cfgNotice" value="Pulling 5-Stars Today!" oninput="pushChanges()" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-3 py-2 text-amber-100">
          </div>
          <div>
            <label class="text-amber-200/90 font-bold block mb-1">Game Patch / Server Tag</label>
            <input type="text" id="cfgPatch" value="Version 7.1 | Asia Server" oninput="pushChanges()" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-3 py-2 text-amber-100">
          </div>
          <div>
            <label class="text-amber-200/90 font-bold block mb-1">Social Media Handle</label>
            <input type="text" id="cfgSocial" value="TikTok & YouTube: @thirddescender" oninput="pushChanges()" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-3 py-2 text-amber-100">
          </div>
          <div>
            <label class="text-amber-200/90 font-bold block mb-1">Elemental Color Theme</label>
            <select id="cfgTheme" onchange="pushChanges()" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-3 py-2 text-amber-100 font-semibold">
              <option value="cryo" selected>Cryo (Cyan / Ice)</option>
              <option value="anemo">Anemo (Teal / Wind)</option>
              <option value="electro">Electro (Purple / Lightning)</option>
              <option value="pyro">Pyro (Red / Flame)</option>
              <option value="hydro">Hydro (Blue / Ocean)</option>
            </select>
          </div>
          <div>
            <label class="text-amber-200/90 font-bold block mb-1">Timer Minutes</label>
            <input type="number" id="cfgMinutes" value="15" min="1" max="60" onchange="setTimerMinutes()" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-2.5 py-1.5 text-amber-100 text-center font-bold">
          </div>
        </div>
      </div>

      <div class="lg:col-span-8 flex flex-col items-center space-y-4">
        <div class="w-full flex items-center space-x-2 bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
          <span class="text-xs text-amber-300 font-bold">Scene:</span>
          <button onclick="switchScene('starting')" id="tab-starting" class="px-3 py-1 rounded bg-amber-500/20 text-amber-200 text-xs font-bold border border-amber-500/50">Starting Soon</button>
          <button onclick="switchScene('brb')" id="tab-brb" class="px-3 py-1 rounded text-slate-400 text-xs font-bold">Be Right Back</button>
          <button onclick="switchScene('ended')" id="tab-ended" class="px-3 py-1 rounded text-slate-400 text-xs font-bold">Stream Ended</button>
        </div>
        <div id="previewFrame" class="w-full aspect-video rounded-xl border-2 border-amber-500/40 starfield-bg p-8 flex flex-col justify-between">
          <div id="renderArea" class="w-full h-full flex flex-col justify-between"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- OBS VIEWPORT -->
  <div id="obsRenderUI" class="hidden starfield-bg flex flex-col justify-between select-none">
    <div id="obsRenderArea" class="w-full h-full flex flex-col justify-between relative z-10"></div>
  </div>

  <script>
    const defaultState = {
      scene: 'starting',
      aspect: 'horizontal',
      channel: '@ThirdDescender',
      title: 'Version 7.1 F2P Speedrun | 0 Chests Challenge',
      notice: 'Pulling 5-Stars Today!',
      patch: 'Version 7.1 | Asia Server',
      social: 'TikTok & YouTube: @thirddescender',
      theme: 'cryo',
      minutes: 15,
      timerSeconds: 900,
      timerRunning: true
    };

    let state = loadState();
    const broadcast = new BroadcastChannel('genshin_overlay_sync');

    function loadState() {
      try {
        const saved = localStorage.getItem('genshin_overlay_state');
        return saved ? JSON.parse(saved) : defaultState;
      } catch(e) { return defaultState; }
    }

    function saveState() {
      try { localStorage.setItem('genshin_overlay_state', JSON.stringify(state)); } catch(e){}
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.has('scene')) {
        state.isObsMode = true;
        state.scene = params.get('scene');
        state.aspect = params.get('aspect') || 'horizontal';
        
        document.getElementById('dashboardUI').classList.add('hidden');
        const obsUI = document.getElementById('obsRenderUI');
        obsUI.classList.remove('hidden');
        obsUI.className = state.aspect === 'vertical' ? 'obs-viewport-vertical starfield-bg flex flex-col justify-between p-12' : 'obs-viewport-horizontal starfield-bg flex flex-col justify-between p-16';
        
        applyTheme(state.theme);
        render();

        // Listen to live updates from localStorage & BroadcastChannel instantly
        window.addEventListener('storage', (e) => {
          if (e.key === 'genshin_overlay_state' && e.newValue) {
            state = JSON.parse(e.newValue);
            applyTheme(state.theme);
            render();
          }
        });
        broadcast.onmessage = (event) => {
          if (event.data) {
            state = event.data;
            applyTheme(state.theme);
            render();
          }
        };
      } else {
        syncInputs();
        applyTheme(state.theme);
        render();
      }
    });

    // Timer loop
    setInterval(() => {
      if (state.timerRunning && state.timerSeconds > 0) {
        state.timerSeconds--;
        updateTimerDisplay();
      }
    }, 1000);

    function pushChanges() {
      state.channel = document.getElementById('cfgChannel').value;
      state.title = document.getElementById('cfgTitle').value;
      state.notice = document.getElementById('cfgNotice').value;
      state.patch = document.getElementById('cfgPatch').value;
      state.social = document.getElementById('cfgSocial').value;
      state.theme = document.getElementById('cfgTheme').value;
      
      saveState();
      broadcast.postMessage(state);
      applyTheme(state.theme);
      render();
    }

    function setTimerMinutes() {
      const mins = parseInt(document.getElementById('cfgMinutes').value) || 15;
      state.minutes = mins;
      state.timerSeconds = mins * 60;
      pushChanges();
    }

    function switchScene(s) {
      state.scene = s;
      ['starting', 'brb', 'ended'].forEach(sceneName => {
        const btn = document.getElementById(`tab-${sceneName}`);
        if(btn) btn.className = sceneName === s ? 'px-3 py-1 rounded bg-amber-500/20 text-amber-200 text-xs font-bold border border-amber-500/50' : 'px-3 py-1 rounded text-slate-400 text-xs font-bold';
      });
      pushChanges();
    }

    function applyTheme(themeName) {
      document.getElementById('appBody').className = `min-h-screen theme-${themeName} bg-slate-950 text-slate-100 flex flex-col`;
    }

    function syncInputs() {
      if(document.getElementById('cfgChannel')) {
        document.getElementById('cfgChannel').value = state.channel;
        document.getElementById('cfgTitle').value = state.title;
        document.getElementById('cfgNotice').value = state.notice;
        document.getElementById('cfgPatch').value = state.patch;
        document.getElementById('cfgSocial').value = state.social;
        document.getElementById('cfgTheme').value = state.theme;
        document.getElementById('cfgMinutes').value = state.minutes;
      }
    }

    function buildMarkup(scene, isObs) {
      const noticeHtml = state.notice.trim() ? `
        <div class="genshin-panel rounded-xl p-3 text-center border border-amber-400/40 bg-slate-900/90 shadow-lg">
          <p class="text-amber-200 font-bold ${isObs ? 'text-2xl' : 'text-xs'} flex items-center justify-center space-x-2">
            <span class="primogem-shape"></span>
            <span>${state.notice}</span>
          </p>
        </div>` : '';

      if (scene === 'starting') {
        return `
          <div class="flex items-center justify-between border-b border-amber-500/20 pb-4">
            <div class="flex items-center space-x-3">
              <span class="primogem-shape"></span>
              <h2 class="font-cinzel font-black glow-gold uppercase ${isObs ? 'text-4xl' : 'text-base'}">${state.channel}</h2>
            </div>
            <span class="px-3 py-1 bg-amber-500/20 border border-amber-500/40 rounded-full text-amber-200 ${isObs ? 'text-xl' : 'text-[11px]'} font-bold uppercase">${state.patch}</span>
          </div>
          <div class="genshin-panel p-6 md:p-10 text-center space-y-4 my-auto flex flex-col justify-center items-center">
            <h3 class="font-cinzel font-bold text-amber-300 uppercase tracking-widest ${isObs ? 'text-3xl' : 'text-xs'}">✦ STREAM STARTING SOON ✦</h3>
            <div id="timerEl" class="font-cinzel font-black glow-accent tracking-widest ${isObs ? 'text-9xl my-6' : 'text-4xl my-2'} text-amber-100">00:00</div>
            <p class="font-semibold text-slate-200 max-w-2xl ${isObs ? 'text-3xl' : 'text-xs'}">${state.title}</p>
            ${noticeHtml}
          </div>
          <div class="flex items-center justify-between border-t border-amber-500/20 pt-4">
            <span class="text-amber-200/80 font-bold uppercase ${isObs ? 'text-xl' : 'text-[11px]'}">LIVE BROADCAST</span>
            <p class="text-slate-300 font-bold uppercase ${isObs ? 'text-xl' : 'text-[11px]'}">${state.social}</p>
          </div>`;
      } else if (scene === 'brb') {
        return `
          <div class="flex items-center justify-between border-b border-amber-500/20 pb-4">
            <div class="flex items-center space-x-3"><span class="primogem-shape"></span><h2 class="font-cinzel font-black glow-gold uppercase ${isObs ? 'text-4xl' : 'text-base'}">${state.channel}</h2></div>
            <span class="px-3 py-1 bg-amber-500/20 border border-amber-500/40 rounded-full text-amber-200 ${isObs ? 'text-xl' : 'text-[11px]'} font-bold uppercase">${state.patch}</span>
          </div>
          <div class="genshin-panel p-6 md:p-10 text-center space-y-4 my-auto flex flex-col justify-center items-center">
            <h3 class="font-cinzel font-bold text-amber-300 uppercase tracking-widest ${isObs ? 'text-4xl' : 'text-sm'}">BE RIGHT BACK</h3>
            <p class="font-semibold text-slate-300 max-w-xl ${isObs ? 'text-2xl' : 'text-xs'}">Stepping away for a quick break!</p>
            ${noticeHtml}
          </div>
          <div class="flex items-center justify-between border-t border-amber-500/20 pt-4"><span class="text-amber-300 font-bold uppercase ${isObs ? 'text-xl' : 'text-[11px]'}">INTERMISSION</span><p class="text-slate-300 font-bold uppercase ${isObs ? 'text-xl' : 'text-[11px]'}">${state.social}</p></div>`;
      } else {
        return `
          <div class="flex items-center justify-between border-b border-amber-500/20 pb-4">
            <div class="flex items-center space-x-3"><span class="primogem-shape"></span><h2 class="font-cinzel font-black glow-gold uppercase ${isObs ? 'text-4xl' : 'text-base'}">${state.channel}</h2></div>
            <span class="px-3 py-1 bg-amber-500/20 border border-amber-500/40 rounded-full text-amber-200 ${isObs ? 'text-xl' : 'text-[11px]'} font-bold uppercase">${state.patch}</span>
          </div>
          <div class="genshin-panel p-6 md:p-10 text-center space-y-4 my-auto flex flex-col justify-center items-center">
            <h3 class="font-cinzel font-bold text-red-400 uppercase tracking-widest ${isObs ? 'text-4xl' : 'text-sm'}">STREAM ENDED</h3>
            <p class="font-semibold text-slate-300 max-w-xl ${isObs ? 'text-2xl' : 'text-xs'}">Thank you for watching today!</p>
            ${noticeHtml}
          </div>
          <div class="flex items-center justify-between border-t border-amber-500/20 pt-4"><span class="text-amber-300 font-bold uppercase ${isObs ? 'text-xl' : 'text-[11px]'}">OFFLINE</span><p class="text-slate-300 font-bold uppercase ${isObs ? 'text-xl' : 'text-[11px]'}">${state.social}</p></div>`;
      }
    }

    function render() {
      const area = state.isObsMode ? document.getElementById('obsRenderArea') : document.getElementById('renderArea');
      if (area) {
        area.innerHTML = buildMarkup(state.isObsMode ? state.scene : state.scene, state.isObsMode);
        updateTimerDisplay();
      }
    }

    function updateTimerDisplay() {
      const mins = Math.floor(state.timerSeconds / 60);
      const secs = state.timerSeconds % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      const timerEls = document.querySelectorAll('#timerEl');
      timerEls.forEach(el => { el.textContent = state.timerSeconds > 0 ? formatted : "STARTING NOW"; });
    }
  </script>
</body>
</html>
